      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.75rem;

      align-items: center;

      font-size: 0.85rem;

      justify-content: center;

      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;

      font-size: 1.2rem;
      font-weight: 600;
      color: #e8edf5;
    }

    .popup-card .popup-body {
      color: #b0bacb;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .popup-card .popup-body strong {
      color: #e8edf5;
    }

    .popup-card .popup-body ul {
      margin: 0.8rem 0 0.5rem 1.2rem;
    }

    .popup-card .popup-body ul li {
      margin-bottom: 0.3rem;
    }

    .popup-card .popup-footer {
      margin-top: 1.2rem;
      border-top: 1px solid #25303e;
      padding-top: 1rem;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

      background: #1e2a36;

      border-radius: 40px;

    .text-muted { color: #6a7a8e; font-size: 0.75rem; }

    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
  </style>
</head>

          ],
          tag: 'Unsanitized output → RCE / SQLi'
        },
        explanation: 'Improper Output Handling occurs when LLM-generated content is passed to downstream systems (shell, SQL, browser) without validation, leading to XSS, RCE, or SQL injection.',
        popup: {
          title: 'LLM10: Improper Output Handling',
          body: `<p><strong>Common sinks:</strong> Shell commands, SQL queries, browser DOM, file paths, terminals.</p>
                 <ul>
                   <li><strong>XSS:</strong> Unsanitized JavaScript returned to browser.</li>
                   <li><strong>RCE:</strong> Output passed to exec() or eval().</li>
                   <li><strong>SQL injection:</strong> Generated queries without parameterization.</li>
                   <li><strong>Terminal injection:</strong> ANSI escape sequences.</li>
                 </ul>
                 <p><strong>Mitigations:</strong> Treat model as untrusted user, apply context-aware encoding, use parameterized queries, CSP, sanitize control chars.</p>`,
          tags: ['CWE-1426', 'CWE-116', 'OWASP ASVS', 'mitigation: output encoding']
        }
      }
    ];

    // ---- DOM refs ----
    const tabContainer = document.getElementById('tabContainer');
    const mainPanel = document.getElementById('mainPanel');
    const popupOverlay = document.getElementById('popupOverlay');
    const popupTitle = document.getElementById('popupTitle');
    const popupBody = document.getElementById('popupBody');
    const popupFooter = document.getElementById('popupFooter');
    const closePopupBtn = document.getElementById('closePopupBtn');

    let activeIndex = 0;

    // ---- render tabs with FULL NAMES ----
    function renderTabs() {
      tabContainer.innerHTML = '';
      risks.forEach((risk, idx) => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${idx === activeIndex ? 'active' : ''}`;
        btn.setAttribute('data-index', idx);
        btn.innerHTML = `<i class="fas ${risk.icon}"></i> ${risk.id} <span class="full-name">${risk.fullName}</span>`;
        btn.addEventListener('click', () => {
          activeIndex = idx;
          renderTabs();
          renderPanel(idx);
        });
        tabContainer.appendChild(btn);
      });
    }

    // ---- render panel ----
    function renderPanel(index) {
      const risk = risks[index];
      if (!risk) return;

      const { id, fullName, example, explanation, popup } = risk;

      // build chat preview
      let chatHtml = '';
      example.chat.forEach(msg => {
        const label = msg.speaker === 'user' ? 'user' : 'assistant';
        chatHtml += `
          <div class="msg">
            <span class="${label === 'user' ? 'user-label' : 'assistant-label'}">${label}:</span>
            <span>${msg.text}</span>
          </div>
        `;
      });

      const panelHtml = `
        <div class="attack-example-grid">
          <div>
            <div class="example-visual">
              <div class="preview-title"><i class="fas fa-comment-dots"></i> ${id} · ${fullName}</div>
              <div class="sim-chat">
                ${chatHtml}
              </div>
              <div style="margin-top:0.6rem; display:flex; gap:6px; flex-wrap:wrap;">
                <span class="attack-tag"><i class="fas fa-skull"></i> ${example.tag}</span>
                <span class="attack-tag" style="background:#1a2a2a; color:#7fc9b0;"><i class="fas fa-shield"></i> ${id}</span>
              </div>
            </div>
          </div>
          <div>
            <div class="explanation-box">
              <h3><i class="fas fa-circle-exclamation" style="color:#f87171;"></i> ${fullName}</h3>
              <p>${explanation}</p>
              <button class="popup-trigger" id="popupTriggerBtn"><i class="fas fa-info-circle"></i> View full explanation</button>
              <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:0.2rem;">
                ${popup.tags.map(t => `<span class="popup-tag ${t.includes('mitigation') ? 'mitigation' : ''}">${t}</span>`).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

      mainPanel.innerHTML = panelHtml;

      // attach popup trigger
      const trigger = document.getElementById('popupTriggerBtn');
      if (trigger) {
        trigger.addEventListener('click', () => {
          openPopup(index);
        });
      }
    }

    // ---- POPUP ----
    function openPopup(index) {
      const risk = risks[index];
      if (!risk) return;
      const pop = risk.popup;
      popupTitle.innerHTML = `<i class="fas fa-info-circle"></i> ${pop.title}`;
      popupBody.innerHTML = pop.body;
      // footer tags
      popupFooter.innerHTML = pop.tags.map(t => 
        `<span class="popup-tag ${t.includes('mitigation') ? 'mitigation' : ''}">${t}</span>`
      ).join('');
      popupOverlay.classList.add('open');
    }

    function closePopup() {
      popupOverlay.classList.remove('open');
    }

    // event listeners
    closePopupBtn.addEventListener('click', closePopup);
    popupOverlay.addEventListener('click', (e) => {
      if (e.target === popupOverlay) closePopup();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePopup();
    });

    // ---- init ----
    renderTabs();
    renderPanel(activeIndex);
  })();
</script>
</body>
</html>
