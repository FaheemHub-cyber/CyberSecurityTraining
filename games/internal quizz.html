const quiz = document.getElementById('quiz');
const count = document.getElementById('count');
const bar = document.getElementById('bar');
const result = document.getElementById('result');

questions.forEach((item,i)=>{
  const card=document.createElement('article'); card.className='card';
  const head=document.createElement('div'); head.className='qhead';
  const num=document.createElement('span'); num.className='num'; num.textContent=`${i+1}.`;
  const tag=document.createElement('span'); tag.className='tag'; tag.textContent=item.kind;
  head.append(num,tag);
  const q=document.createElement('p'); q.className='q'; q.textContent=item.q;
  card.append(head,q);
  item.options.forEach((opt,j)=>{
    const label=document.createElement('label'); label.className='option';
    const input=document.createElement('input'); input.type='radio'; input.name=`q${i}`; input.value=j;
    input.addEventListener('change',updateProgress);
    label.append(input,document.createTextNode(opt)); card.append(label);
  });
  quiz.append(card);
});
function updateProgress(){
  const answered=[...document.querySelectorAll('input[type=radio]:checked')].length;
  count.textContent=answered; bar.style.width=(answered/questions.length*100)+'%';
}
document.getElementById('submit').addEventListener('click',()=>{
  let score=0, answered=0;
  questions.forEach((item,i)=>{
    const selected=document.querySelector(`input[name="q${i}"]:checked`);
    if(selected){answered++; if(+selected.value===item.answer)score++;}
  });
  const pct=Math.round(score/questions.length*100);
  let html=`<div class="score">${score}/100</div><div>${pct}% · ${answered} answered</div>`;
  html+=`<div class="review"><h2>Results & Correct Answers</h2>`;
  questions.forEach((item,i)=>{
    const selected=document.querySelector(`input[name="q${i}"]:checked`);
    const got=selected ? +selected.value : -1;
    const ok=got===item.answer;
    html+=`<article class="card ${ok?'correct':'wrong'}">
      <div class="qhead"><span class="num">${i+1}.</span><span class="tag">${ok?'Correct':'Incorrect'}</span></div>
      <p class="q">${escapeHtml(item.q)}</p>
      <div><strong>Your answer:</strong> ${got>=0?escapeHtml(item.options[got]):'Not answered'}</div>
      <div><strong>Correct answer:</strong> ${escapeHtml(item.options[item.answer])}</div>
      <div class="explain">${escapeHtml(item.explanation)}</div>
    </article>`;
  });
  html+=`</div><button class="reset" onclick="location.reload()">Retake Test</button>`;
  result.innerHTML=html; result.style.display='block'; result.scrollIntoView({behavior:'smooth'});
});
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
